<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Counter</title>
  </head>
  <body>
    <div class="flex h-screen justify-center items-center">
      <div
        class="flex flex-col box-border h-48 border-4 p-4 shadow-2xl w-81.25"
      >
        <h1 class="text-2xl font-bold text-center">Counter</h1>
        <p class="text-1xl font-bold text-center translate-y-3" id="numTracker">Number: 0</p>

        <button
          type="button"
          class="flex size-16 cursor-pointer items-center justify-center self-end rounded-full bg-blue-500 text-white transition duration-300 ease-in-out hover:bg-blue-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 translate-y-14"
          aria-label="Add Num"
          id="addition"
        >
          +
        </button>

        <button
          type="button"
          class="flex size-16 cursor-pointer items-center justify-center self-center rounded-full bg-blue-500 text-white transition duration-300 ease-in-out hover:bg-blue-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 "
          aria-label="Reset Number"
          id="reset"
        >
          X
        </button>

        <button
          type="button"
          class="flex size-16 cursor-pointer items-center justify-center rounded-full bg-red-500 text-white transition duration-300 ease-in-out hover:bg-red-600 focus-visible:outline-2 focus-visible:outline-offset-2  focus-visible:outline-blue-500 -translate-y-2"
          aria-label="Add Num"
          id="subtract"
        >
          -
        </button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
